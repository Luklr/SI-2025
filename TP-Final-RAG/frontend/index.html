<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema RAG - Consulta de Base de Datos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            padding: 30px;
        }

        .info-box {
            background: #3498db;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .info-box h3 {
            margin-bottom: 10px;
        }

        .query-form {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .query-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .query-input:focus {
            outline: none;
            border-color: #3498db;
        }

        .query-button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .query-button:hover {
            transform: translateY(-2px);
        }

        .query-button:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .response-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            display: none;
        }

        .response-content {
            line-height: 1.6;
            color: #2c3e50;
            font-size: 16px;
        }

        .error {
            background: #e74c3c;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Sistema RAG</h1>
            <p>Consulta tu base de datos usando lenguaje natural</p>
        </div>

        <div class="main-content">
            <div class="info-box">
                <h3>💡 Cómo usar el sistema</h3>
                <p>Escribe tu pregunta en lenguaje natural y obtendrás una respuesta basada en la información de la base de datos.</p>
            </div>

            <div class="query-form">
                <input type="text" id="queryInput" class="query-input" 
                       placeholder="Escribe tu pregunta aquí... (ej: ¿Cuántos estudiantes cursan Física?)"
                       onkeypress="handleKeyPress(event)">
                <button class="query-button" onclick="submitQuery()" id="queryButton">
                    Consultar
                </button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Procesando consulta...</p>
            </div>

            <div id="response" class="response-section">
                <div class="response-content" id="response-content"></div>
            </div>
        </div>
    </div>

    <script>
        // Función para manejar Enter en el input de consulta
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                submitQuery();
            }
        }

        // Función para enviar consulta
        async function submitQuery() {
            const query = document.getElementById('queryInput').value.trim();
            if (!query) {
                showMessage('Por favor, ingresa una consulta');
                return;
            }

            const loading = document.getElementById('loading');
            const response = document.getElementById('response');
            const queryButton = document.getElementById('queryButton');

            // Mostrar loading
            loading.classList.add('show');
            response.style.display = 'none';
            queryButton.disabled = true;

            try {
                const res = await fetch('/query?q=' + encodeURIComponent(query), {
                    method: 'GET'
                });

                const responseText = await res.text();

                if (res.ok) {
                    displayResponse(responseText);
                } else {
                    showMessage('Error en la consulta');
                }
            } catch (error) {
                showMessage('Error de conexión: ' + error.message);
            } finally {
                loading.classList.remove('show');
                queryButton.disabled = false;
            }
        }

        // Función para mostrar respuesta
        function displayResponse(responseText) {
            const response = document.getElementById('response');
            const responseContent = document.getElementById('response-content');

            responseContent.innerHTML = `<h3>💬 Respuesta:</h3><p>${responseText}</p>`;
            response.style.display = 'block';
        }

        // Función para mostrar mensajes de error
        function showMessage(message) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'error';
            messageDiv.textContent = message;
            
            document.querySelector('.main-content').insertBefore(messageDiv, document.querySelector('.query-form'));
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }
    </script>
</body>
</html>
